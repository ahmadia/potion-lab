<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fizzwick's Potion Lab — no rush</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Potion Lab">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --night:#1B1120;--wood:#4A3328;--wood-lit:#5E4232;
  --parchment:#EFE3C8;--parchment-dim:#C9B896;--ink:#2C1F1A;
  --amber:#FFC061;--candle:rgba(255,192,97,.30);
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ui:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--parchment);
  background:radial-gradient(120% 80% at 50% -10%,#3A2440 0%,rgba(58,36,64,0) 60%),
    radial-gradient(90% 60% at 50% 40%,var(--candle) 0%,rgba(0,0,0,0) 70%),var(--night);
  background-attachment:fixed;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 24px;min-height:100dvh;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:17px;flex:1;line-height:1.15;min-width:120px}
.mark small{display:block;font-family:var(--ui);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--parchment-dim);margin-top:3px}
.chip{border:1px solid rgba(239,227,200,.22);border-radius:999px;padding:7px 12px;font-size:12.5px;
  color:var(--parchment-dim);background:rgba(239,227,200,.04);transition:.18s}
.chip:hover{color:var(--parchment);border-color:rgba(255,192,97,.5)}
.chip.live{color:var(--amber);border-color:rgba(255,192,97,.45)}

.fuse{position:relative;height:3px;border-radius:2px;background:rgba(239,227,200,.13)}
.fuse.hide{visibility:hidden}
.fuse i{position:absolute;inset:0 auto 0 0;border-radius:2px;width:100%;transform-origin:left;
  background:linear-gradient(90deg,rgba(255,192,97,.25),var(--amber))}
.fuse i::after{content:"";position:absolute;right:-4px;top:50%;width:11px;height:11px;transform:translateY(-50%);
  border-radius:50%;background:radial-gradient(circle,#FFF0C9 0%,var(--amber) 45%,rgba(255,192,97,0) 72%)}

.stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.cauldron{position:relative;width:230px;height:132px}
.brew{position:absolute;left:14px;right:14px;top:14px;height:26px;border-radius:50%;filter:blur(1px);opacity:.9;transition:background .5s}
.pot{position:absolute;inset:22px 0 0 0;border-radius:0 0 110px 110px / 0 0 78px 78px;
  background:linear-gradient(180deg,#3B2B3F,#241A2A);
  box-shadow:inset 0 12px 22px rgba(0,0,0,.55),0 16px 34px rgba(0,0,0,.45);
  border:1px solid rgba(239,227,200,.10);border-top:none}
.rim{position:absolute;left:-6px;right:-6px;top:16px;height:16px;border-radius:50%;
  background:linear-gradient(180deg,#5B4460,#33243A);border:1px solid rgba(239,227,200,.14)}
.glow{position:absolute;left:50%;top:6px;width:180px;height:80px;transform:translateX(-50%);opacity:.34;filter:blur(9px);transition:background .5s}
.bubble{position:absolute;bottom:44px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);animation:rise 3.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:.75}100%{transform:translateY(-58px) scale(1.15);opacity:0}}
.cauldron.pop .glow{animation:flare .5s ease-out}
@keyframes flare{0%{opacity:.34}35%{opacity:.95}100%{opacity:.34}}

.feed{position:absolute;top:2px;right:6px;display:flex;align-items:center;gap:6px;opacity:0;
  transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.feed.on{opacity:1;transform:translateY(0)}
.feed b{font-family:var(--display);font-size:15px;color:var(--amber)}

.q{font-family:var(--display);font-size:clamp(40px,12vw,66px);line-height:1;text-align:center;
  font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(255,192,97,.30)}
.q .op{color:var(--amber);opacity:.85;margin:0 .12em}
.q .ask{color:var(--parchment-dim)}
.tag{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--parchment-dim);
  border:1px solid rgba(239,227,200,.2);border-radius:999px;padding:3px 10px;opacity:0;transition:opacity .25s}
.tag.on{opacity:.9}
.say{min-height:20px;font-size:13.5px;color:var(--parchment-dim);text-align:center;padding:0 8px}
.say.good{color:#6FE3B8}
.say.miss{color:var(--amber)}

.rack{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.rack{grid-template-columns:repeat(4,1fr);gap:14px}}
.bottle{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 0;transition:transform .14s}
.bottle:active{transform:translateY(2px) scale(.98)}
.cork{width:20px;height:11px;border-radius:3px 3px 2px 2px;background:linear-gradient(180deg,#8A6A45,#6B4F32);border:1px solid rgba(0,0,0,.3)}
.neck{width:15px;height:12px;background:rgba(239,227,200,.13);border-left:1px solid rgba(239,227,200,.18);border-right:1px solid rgba(239,227,200,.18)}
.glass{position:relative;width:100%;min-height:92px;border-radius:12px 12px 20px 20px;
  background:linear-gradient(160deg,rgba(239,227,200,.13),rgba(239,227,200,.05));
  border:1px solid rgba(239,227,200,.20);overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:inset -8px 0 16px rgba(0,0,0,.28),inset 8px 0 12px rgba(255,255,255,.05);transition:border-color .2s,box-shadow .2s}
.fill{position:absolute;left:0;right:0;bottom:0;height:58%;opacity:.42;transition:height .3s,opacity .3s;
  background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
.fill::before{content:"";position:absolute;left:-25%;right:-25%;top:-9px;height:18px;border-radius:50%;background:inherit;opacity:.85}
.num{position:relative;font-family:var(--display);font-size:clamp(26px,7.5vw,36px);
  font-variant-numeric:tabular-nums;color:#FFF6E2;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.bottle .kbd{position:absolute;top:26px;left:8px;font-size:10px;color:rgba(239,227,200,.4)}
@media(hover:hover){.bottle:hover .glass{border-color:rgba(255,192,97,.55);box-shadow:inset -8px 0 16px rgba(0,0,0,.28),0 0 22px rgba(255,192,97,.22)}}
.bottle.right .glass{border-color:#6FE3B8;box-shadow:0 0 30px rgba(111,227,184,.5)}
.bottle.right .fill{height:100%;opacity:.8}
.bottle.wrong{animation:shake .34s}
.bottle.wrong .glass{border-color:rgba(255,127,168,.7)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.rack.locked .bottle{pointer-events:none}

.drops{display:flex;justify-content:center;gap:7px;padding-top:2px}
.drops span{width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:rgba(239,227,200,.16);transition:.28s}
.drops span.on{background:#6FE3B8;box-shadow:0 0 10px rgba(111,227,184,.75)}
.meta{display:flex;justify-content:center;gap:18px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--parchment-dim)}
.meta b{color:var(--parchment);font-weight:600}

.shelf{display:none;flex-direction:column;gap:6px;padding-bottom:8px}
.shelf.on{display:flex}
.play.off{display:none}
.rowblock{margin-bottom:20px}
.rowtop{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.rowtop svg{width:46px;height:46px;flex:none}
.rowtop .who{flex:1;min-width:0}
.rowtop h3{margin:0;font-family:var(--display);font-size:18px;font-weight:500;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rowtop h3 em{font-style:normal;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--parchment-dim);font-family:var(--ui)}
.petline{font-size:11.5px;color:var(--parchment-dim);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.petline u{text-decoration:none;border-bottom:1px dotted rgba(239,227,200,.35);cursor:pointer}
.xp{flex:1;max-width:120px;height:4px;border-radius:2px;background:rgba(239,227,200,.14);overflow:hidden}
.xp i{display:block;height:100%;border-radius:2px}
.plate{font-family:var(--display);font-size:12.5px;color:var(--ink);
  background:linear-gradient(180deg,#E9D9AF,#CBB683);border-radius:3px;padding:2px 9px;box-shadow:0 2px 7px rgba(0,0,0,.45)}
.jars{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.plank{height:8px;border-radius:2px;margin-top:5px;background:linear-gradient(180deg,var(--wood-lit),var(--wood));box-shadow:0 5px 12px rgba(0,0,0,.5)}
.jar{position:relative;height:50px;border-radius:4px 4px 6px 6px;background:rgba(239,227,200,.07);
  border:1px solid rgba(239,227,200,.16);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.jar i{position:absolute;left:0;right:0;bottom:0;height:8%;opacity:.3;transition:height .4s}
.jar.full{border-color:rgba(255,255,255,.35)}
.jar.full i{opacity:.85}
.jar b{position:relative;font-size:9.5px;font-weight:600;color:rgba(255,246,226,.9);padding-bottom:3px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--parchment-dim);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(239,227,200,.2)}
.dot.l{background:rgba(255,192,97,.55)}
.dot.m{background:#6FE3B8;box-shadow:0 0 8px rgba(111,227,184,.7)}
.empty{font-family:var(--display);font-size:15px;color:var(--parchment-dim);line-height:1.5;margin:6px 0 0}
.danger{align-self:flex-start;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:8px;
  color:rgba(255,127,168,.65);border-bottom:1px solid rgba(255,127,168,.3);padding-bottom:2px}
.backup{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px}
.setlabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--parchment-dim)}
.modechip.live{color:var(--ink);background:var(--amber);border-color:var(--amber)}

.veil{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(20,12,24,.88);backdrop-filter:blur(7px);z-index:20}
.veil.on{display:flex}
.card{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.card .flask{width:74px;height:96px;border-radius:10px 10px 34px 34px;position:relative;overflow:hidden;
  border:1px solid rgba(239,227,200,.3);background:rgba(239,227,200,.06)}
.card .flask i{position:absolute;left:0;right:0;bottom:0;height:74%;opacity:.85}
.card h2{font-family:var(--display);font-size:26px;margin:0;font-weight:500;line-height:1.25}
.card p{margin:0;font-size:13.5px;color:var(--parchment-dim);line-height:1.55}
.card svg.big{width:120px;height:120px;animation:hatch .6s ease-out}
@keyframes hatch{0%{transform:scale(.3) rotate(-12deg);opacity:0}60%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.go{padding:13px 26px;border-radius:999px;background:var(--amber);color:var(--ink);font-weight:650;font-size:14.5px;box-shadow:0 8px 24px rgba(255,192,97,.3)}
.ghost{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--parchment-dim)}
.namein{width:100%;padding:12px 14px;border-radius:8px;text-align:center;font-family:var(--display);font-size:19px;
  background:rgba(239,227,200,.08);border:1px solid rgba(239,227,200,.28);color:var(--parchment)}
.namein::placeholder{color:rgba(239,227,200,.35)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:25;
  display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;
  background:rgba(43,27,49,.96);border:1px solid rgba(255,192,97,.35);box-shadow:0 12px 30px rgba(0,0,0,.5);
  opacity:0;transition:.28s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:36px;height:36px;flex:none}
.toast span{font-family:var(--display);font-size:15px;line-height:1.3}
.peek{align-self:center;margin-top:2px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,192,97,.4);
  color:var(--amber);background:rgba(255,192,97,.06);font-size:13px;transition:.18s}
.peek::before{content:"🔢 "}
@media(hover:hover){.peek:hover{background:rgba(255,192,97,.16)}}
.ghost2{padding:11px 22px;border-radius:999px;border:1px solid rgba(239,227,200,.28);color:var(--parchment);font-weight:600;font-size:13.5px}

.chartcard{max-width:560px}
.charthead{font-family:var(--display);font-size:21px;color:var(--parchment);line-height:1.2}
.charthead b{color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;width:100%}
.cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:5px;
  font-size:clamp(8px,2.3vw,13px);font-variant-numeric:tabular-nums;background:rgba(239,227,200,.045);
  color:rgba(239,227,200,.55);transition:background .25s,color .25s,transform .25s,box-shadow .25s}
.cell.hdr{background:transparent;color:var(--parchment-dim);font-weight:600}
.cell.dim{opacity:.1}
.cell.band{background:rgba(255,192,97,.1);color:var(--parchment)}
.cell.step{background:rgba(255,192,97,.32);color:#FFF6E2;box-shadow:0 0 10px rgba(255,192,97,.4)}
.cell.answer{background:var(--amber);color:var(--ink);font-weight:700;transform:scale(1.15);box-shadow:0 0 16px rgba(255,192,97,.75)}
.numline{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;width:100%}
.chartsay{min-height:22px;font-size:15px;color:var(--amber);font-family:var(--display)}

.storycard{max-width:420px}
.storycard #storyText{font-family:var(--display);font-size:18.5px;line-height:1.55;color:var(--parchment)}
.storycard #storyPet svg{filter:drop-shadow(0 0 10px rgba(255,192,97,.35))}
.bookcard{max-width:460px;max-height:82vh;overflow:auto}
.bookcount{font-size:13px;color:var(--parchment-dim);margin:-4px 0 2px}
.bookgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:100%}
.bookcell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:6px;
  font-size:12px;font-variant-numeric:tabular-nums;border:1px solid rgba(239,227,200,.14);
  background:rgba(239,227,200,.04);color:rgba(239,227,200,.35)}
.bookcell.got{border-color:rgba(255,192,97,.55);background:rgba(255,192,97,.16);color:#FFF6E2;cursor:pointer}
@media(hover:hover){.bookcell.got:hover{background:rgba(255,192,97,.3)}}
#bookList{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;margin:2px 0}
.bookitem{border:1px solid rgba(239,227,200,.16);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--parchment-dim);background:rgba(239,227,200,.03)}
.bookitem b{color:var(--amber);font-family:var(--display);font-weight:500;display:block;margin-bottom:3px;font-size:13px}
.bookempty{color:var(--parchment-dim);font-size:14.5px;line-height:1.5}
.startbrew{align-self:center;margin:2px 0 16px;padding:14px 34px;font-size:16px}
.iknow{display:inline-block;margin-top:5px;font-size:11.5px;color:var(--amber);border:1px solid rgba(255,192,97,.4);border-radius:999px;padding:4px 11px;background:rgba(255,192,97,.06)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Fizzwick's Potion Lab<small id="brewCount">Potion 1</small></div>
    <button class="chip" id="modeBtn">No timer</button>
    <button class="chip" id="soundBtn" aria-pressed="true">Sound on</button>
    <button class="chip" id="shelfBtn">My shelf</button>
  </header>

  <section class="play" id="play">
    <div class="fuse hide" id="fuseBar" aria-hidden="true"><i id="fuse"></i></div>
    <div class="stage">
      <div class="feed" id="feed" aria-hidden="true"></div>
      <div class="cauldron" id="cauldron" aria-hidden="true">
        <div class="glow" id="glow"></div><div class="rim"></div><div class="pot"></div><div class="brew" id="brew"></div>
        <span class="bubble" style="left:78px;animation-delay:0s"></span>
        <span class="bubble" style="left:112px;animation-delay:1.1s"></span>
        <span class="bubble" style="left:140px;animation-delay:2.2s"></span>
      </div>
      <div class="tag" id="tag"></div>
      <div class="q" id="question" aria-live="polite"></div>
      <div class="say" id="say">Take as long as you like. Nothing is timing you.</div>
    </div>
    <div class="rack" id="rack"></div>
    <button class="peek" id="chartBtn">Peek at the chart</button>
    <div class="drops" id="drops" aria-hidden="true"></div>
    <div class="meta">
      <div>Jars <b id="mastered">0</b>/<span id="jarTotal">100</span></div>
      <div>Pets <b id="petCount">0</b>/<span id="petTotal">10</span></div>
    </div>
  </section>

  <section class="shelf" id="shelf">
    <button class="go startbrew" id="brewBtn">▶ Start brewing</button>
    <div id="shelves"></div>
    <div class="legend">
      <span><i class="dot"></i> Not brewed yet</span>
      <span><i class="dot l"></i> Getting there</span>
      <span><i class="dot m"></i> <b id="legGlow" style="font-weight:400"></b></span>
    </div>
    <p class="empty" id="shelfNote"></p>
    <div class="settings">
      <span class="setlabel">Practice:</span>
      <button class="chip modechip" id="modeX">Times Tables</button>
      <button class="chip modechip" id="modeAS">Add &amp; Subtract</button>
    </div>
    <div class="backup">
      <button class="chip" id="storybookBtn">📖 My storybook</button>
      <button class="chip" id="exportBtn">Back up to Files</button>
      <button class="chip" id="importBtn">Restore from Files</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <button class="danger" id="resetBtn">Empty every jar</button>
  </section>
</div>

<div class="veil" id="done">
  <div class="card">
    <div class="flask"><i id="doneFill"></i></div>
    <h2 id="doneName"></h2>
    <p id="doneLine"></p>
    <button class="go" id="storyBtn">✨ Read the lab story</button>
    <button class="ghost2" id="againBtn">Brew another</button>
    <button class="ghost" id="peekBtn">See my shelf</button>
  </div>
</div>

<div class="veil" id="namer">
  <div class="card">
    <div id="namePet"></div>
    <h2 id="nameTitle"></h2>
    <p id="nameLine"></p>
    <input class="namein" id="nameIn" maxlength="20" placeholder="Give it a name" autocomplete="off">
    <button class="go" id="nameBtn">That's its name</button>
  </div>
</div>

<div class="veil" id="chart">
  <div class="card chartcard">
    <div class="charthead" id="chartHead"></div>
    <div class="grid" id="grid"></div>
    <div class="numline" id="numline"></div>
    <p class="chartsay" id="chartSay"></p>
    <button class="go" id="chartClose">Back to my potion</button>
  </div>
</div>

<div class="veil" id="story">
  <div class="card storycard">
    <div id="storyPet"></div>
    <h2 id="storyTitle">A little lab tale</h2>
    <p id="storyText"></p>
    <button class="go" id="storyClose">Back to brewing</button>
  </div>
</div>

<div class="veil" id="storybook">
  <div class="card bookcard">
    <h2>📖 My Storybook</h2>
    <p class="bookcount" id="bookCount"></p>
    <div class="bookgrid" id="bookGrid"></div>
    <button class="go" id="bookClose">Close</button>
  </div>
</div>

<div class="veil" id="migrate">
  <div class="card">
    <div id="migratePet"></div>
    <h2>Welcome back!</h2>
    <p id="migrateLine">We found your animals and stories from the old lab. Want to bring them into the new one?</p>
    <button class="go" id="migrateYes">Bring my progress in</button>

/* ================= potion names, never repeated ================= */
function potionName(){
  var free=[],i,j,n;
  for(i=0;i<ADJ.length;i++)for(j=0;j<NOUN.length;j++){n=ADJ[i]+' '+NOUN[j];if(!used[n])free.push(n);}
  if(free.length){n=free[Math.floor(Math.random()*free.length)];used[n]=1;return n;}
  var k=2;
  while(true){
    n=ADJ[Math.floor(Math.random()*ADJ.length)]+' '+NOUN[Math.floor(Math.random()*NOUN.length)]+' No. '+k;
    if(!used[n]){used[n]=1;return n;}
    k++;
  }
}

/* ================= storage (real localStorage, survives close/reopen) ================= */
function snapshot(){return {v:8,mode:MODE,facts:facts,plates:plates,pets:pets,used:used,species:species,usedStories:usedStories,storyLog:storyLog,brewed:brewed,sound:sound,calm:calm};}
function save(){
  if(!storeOk)return;
  try{localStorage.setItem(KEY,JSON.stringify(snapshot()));}catch(e){storeOk=false;}
}
function readKey(k){
  try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}
}
function absorb(d){
  facts=d.facts||{};plates=d.plates||{};pets=d.pets||{};used=d.used||{};species=d.species||{};brewed=d.brewed||0;
  usedStories=d.usedStories||{};storyLog=d.storyLog||[];
  MODE=(d.mode==='as')?'as':'x';
  if(typeof d.sound==='boolean')sound=d.sound;
  if(typeof d.calm==='boolean')calm=d.calm;
  for(var k in facts){var f=facts[k];if(f.e===undefined)f.e=(f.s>=3&&f.ema>0&&f.ema<=3500)?1:0;}
  buildSecs();
}
function load(){
  var d=readKey(KEY);
  if(d){absorb(d);return true;}
  for(var i=0;i<PRIOR.length;i++){var p=readKey(PRIOR[i]);if(p){absorb(p);return true;}}
  return false;
}

/* ================= sound ================= */
var ac=null;
function beep(fs,dur,vol){
  if(!sound)return;
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    fs.forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*0.085;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.05);
    });
  }catch(e){}
}

/* ================= selection ================= */
function inProgress(){var n=0;SECS.forEach(function(a){for(var b=1;b<=BMAX;b++){var f=getFact(a,b);if(f.n>0&&!earned(f))n++;}});return n;}
function nextUnseen(){
  for(var i=0;i<SECS.length;i++){var a=SECS[i];
    for(var j=0;j<TEACH.length;j++){var b=TEACH[j];if(getFact(a,b).n===0)return {a:a,b:b};}}
  return null;
}
function weight(f){
  if(!earned(f)){
    var need=calm?REPS:3;
    var w=3+Math.max(0,need-f.s)*1.2;
    if(!calm){ if(f.ema>4500)w+=2.2;else if(f.ema>FAST)w+=1; }
    return w;
  }
  return slipping(f)?2:0.5;
}
function pick(){
  var pool=[],total=0;
  SECS.forEach(function(a){
    for(var b=1;b<=BMAX;b++){
      var f=getFact(a,b);
      if(f.n===0||fkey(a,b)===lastKey)continue;
      var w=weight(f);total+=w;pool.push({a:a,b:b,w:w,fresh:false});
    }
  });
  var nu=nextUnseen();
  if(nu&&(inProgress()<4||!pool.length)){pool.push({a:nu.a,b:nu.b,w:6,fresh:true});total+=6;}
  if(!pool.length)return {a:SECS[0],b:1,fresh:false};
  var r=Math.random()*total;
  for(var i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0)return pool[i];}
  return pool[pool.length-1];
}
function limitFor(f){
  if(f.n===0)return 12000;
  if(!earned(f))return f.ema?Math.max(7000,Math.min(11000,f.ema*2.4)):10000;
  return 6500;
}
/* three clearly-different wrong answers, spread around the real answer p.
   step = the table (count-by neighbours) for ×, or 1 (adjacent numbers) for +/− */
function distractors(a,p){
  var step=SEC[a].op==='x'?SEC[a].n:1;
  var cand=[p+step,p-step,p+2*step,p-2*step,p+3*step,p-3*step],out=[],seen={},i,v;
  seen[p]=1;
  for(i=0;i<cand.length&&out.length<3;i++){v=cand[i];if(v>=0&&!seen[v]){seen[v]=1;out.push(v);}}
  var g=1;while(out.length<3){v=p+g;if(v>=0&&!seen[v]){seen[v]=1;out.push(v);}g++;}
  return out;
}
function shuffle(A){for(var i=A.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=A[i];A[i]=A[j];A[j]=t;}return A;}

/* ================= a question ================= */
function ask(){
  if($('namer').classList.contains('on'))return;
  locked=false;rack.classList.remove('locked');
  var p=pick(),a=p.a,b=p.b,f=getFact(a,b);
  var q=factOf(a,b);
  var flip=commutative(a)&&Math.random()<0.45;
  cur={a:a,b:b,ans:q.ans,left:flip?q.right:q.left,right:flip?q.left:q.right,op:q.op,fresh:p.fresh,limit:limitFor(f)};
  lastKey=fkey(a,b);
  paintCauldron(hueOf(a));
  var pet=getPet(a);
  if(p.fresh) tag.textContent='New ingredient';
  else if(earned(f)) tag.textContent=(pet&&pet.name)?pet.name+' is watching':'You know this one';
  else tag.textContent=calm?('Learning · '+Math.min(f.s,REPS)+' of '+REPS):'Still learning';
  tag.classList.add('on');
  question.innerHTML=cur.left+'<span class="op">'+cur.op+'</span>'+cur.right+'<span class="op">=</span><span class="ask">?</span>';
  say.textContent='';say.className='say';
  var opts=shuffle(distractors(a,q.ans).concat([cur.ans]));
  rack.innerHTML='';
  opts.forEach(function(v,i){
    var btn=document.createElement('button');
    btn.className='bottle';btn.setAttribute('aria-label',String(v));
    btn.innerHTML='<span class="cork"></span><span class="neck"></span><span class="glass">'+
      '<span class="fill" style="background-color:'+hueOf(a)+';height:'+(38+i*11)+'%"></span>'+
      '<span class="num">'+v+'</span></span><span class="kbd">'+(i+1)+'</span>';
    btn.onclick=function(){answer(v,btn);};
    rack.appendChild(btn);
  });
  tStart=Date.now();
  if(calm){cancelAnimationFrame(raf);} else runFuse(cur.limit);
}
function runFuse(ms){
  cancelAnimationFrame(raf);
  var t0=Date.now();
  (function step(){
    if(calm){fuse.style.transform='scaleX(1)';return;}
    var left=1-(Date.now()-t0)/ms;
    if(left<=0){fuse.style.transform='scaleX(0)';timeUp();return;}
    fuse.style.transform='scaleX('+left+')';raf=requestAnimationFrame(step);
  })();
}
function markRight(){
  var k=rack.children;
  for(var i=0;i<k.length;i++)if(parseInt(k[i].getAttribute('aria-label'),10)===cur.ans)k[i].classList.add('right');
}

var feedT=null;
function feed(a){
  var pet=getPet(a);
  if(!pet||!pet.name)return null;
  var before=stageOf(pet.xp).name;
  pet.xp++;
  var after=stageOf(pet.xp);
  var el=$('feed');
  el.innerHTML=petSVG(designFor(a),38,after.name==='Radiant',hueOf(a))+'<b>+1</b>';
  el.classList.add('on');
  clearTimeout(feedT);feedT=setTimeout(function(){el.classList.remove('on');},1100);
  if(after.name!==before)setTimeout(function(){toast(a,pet.name+' is now '+after.name+'.');beep([523,784,1046],0.22,0.08);},700);
  return pet;
}
function afterTurn(delay){
  if(queue.length){setTimeout(showNamer,delay);return;}
  if(drops>=ROUND){setTimeout(finish,delay);return;}
  setTimeout(ask,delay);
}
function answer(v,btn){
  if(locked)return;
  locked=true;rack.classList.add('locked');cancelAnimationFrame(raf);
  var ms=Date.now()-tStart,f=getFact(cur.a,cur.b),was=earned(f);
  f.n++;
  if(v===cur.ans){
    f.c++;f.s++;f.ema=f.ema?Math.round(f.ema*0.6+ms*0.4):ms;streak++;
    btn.classList.add('right');
    cauldron.classList.add('pop');setTimeout(function(){cauldron.classList.remove('pop');},520);
    beep([660,880,1180],0.16,0.09);
    say.textContent='Yes! That one goes in.';
    say.className='say good';
    var pet=feed(cur.a);if(pet)say.textContent='Yes! '+pet.name+' ate that one.';
    if(!was&&!earned(f)){
      var left=REPS-f.s;
      if(left>0&&left<=2)say.textContent=left===1?'One more and this jar lights up!':left+' more and this jar lights up.';
    }
    if(checkEarn(f)&&!was){
      say.textContent='✨ That jar is glowing now!';
      if(rowDone(cur.a)&&!(pets[cur.a]&&pets[cur.a].name))queue.push(cur.a);
    }
    drops++;paintDrops();updateMeta();save();
    afterTurn(720);
  }else{
    btn.classList.add('wrong');markRight();
    beep([523,392],0.14,0.05);
    say.textContent='It’s '+cur.left+' '+cur.op+' '+cur.right+' = '+cur.ans+'. You’ve got this — next one!';
    say.className='say';
    updateMeta();save();afterTurn(1500);
  }
}
function timeUp(){
  if(locked||calm)return;
  locked=true;rack.classList.add('locked');
  var f=getFact(cur.a,cur.b);f.n++;f.s=0;streak=0;
  markRight();beep([380],0.22,0.05);
  say.textContent=cur.left+' '+cur.op+' '+cur.right+' is '+cur.ans+'. Here it is — take it again later.';
  say.className='say miss';
  updateMeta();save();afterTurn(2100);
}

  if($('shelf').classList.contains('on')){buildShelf();return;}
  if(queue.length){setTimeout(showNamer,420);return;}
  if(drops>=ROUND)setTimeout(finish,300);else setTimeout(ask,300);
}

/* ================= potion done ================= */
function finish(){
  brewed++;
  var hue=hueOf(cur.a),name=potionName();
  save();
  $('doneName').textContent=name;
  $('doneFill').style.background=hue;
  $('doneLine').textContent='You poured a whole new potion! '+countGlow()+' of '+totalJars()+' jars glowing. Every potion has its own name.';
  $('done').classList.add('on');
  beep([660,880,1100,1320],0.22,0.09);
  updateMeta();
}

/* ================= shelf ================= */
function buildShelf(){
  var host=$('shelves');host.innerHTML='';
  SECS.forEach(function(a){
    var done=rowDone(a),pet=getPet(a),block=document.createElement('div');
    block.className='rowblock';
    var head;
    if(pet&&pet.name){
      var st=stageOf(pet.xp),nx=nextAt(pet.xp),prev=st.at,span=nx?nx-prev:1,got=nx?pet.xp-prev:1;
      head='<div class="rowtop">'+petSVG(designFor(a),46,st.name==='Radiant',hueOf(a))+
        '<div class="who"><h3>'+esc(pet.name)+' <em>'+SPECIES[designFor(a)]+'</em>'+
        (plates[a]?'<span class="plate">'+esc(plates[a])+'</span>':'')+'</h3>'+
        '<div class="petline"><u data-ren="'+a+'">'+st.name+' &middot; rename</u>'+
        '<span class="xp"><i style="width:'+(nx?Math.round(got/span*100):100)+'%;background:'+hueOf(a)+'"></i></span>'+
        '<span>'+(nx?(nx-pet.xp)+' more to grow up':'fully grown')+'</span></div></div></div>';
    }else{
      head='<div class="rowtop">'+eggSVG(a,46)+
        '<div class="who"><h3>'+SEC[a].label+' <em>'+SEC[a].sub+'</em></h3>'+
        '<div class="petline">'+(done?'Ready to hatch':'Light up all ten jars and this egg hatches')+
        (done?'':' <u class="iknow" data-know="'+a+'">I already know '+SEC[a].label.toLowerCase()+'</u>')+'</div></div></div>';
    }
    var jars='<div class="jars">';
    for(var b=1;b<=BMAX;b++){
      var f=getFact(a,b),full=earned(f),q=factOf(a,b);
      var h=f.n===0?8:(full?100:Math.min(88,26+f.s*(calm?12:18)));
      jars+='<div class="jar'+(full?' full':'')+'" title="'+q.left+' '+q.op+' '+q.right+' = '+q.ans+(full?'':' · '+f.s+' of '+(calm?REPS:3))+'">'+
        '<i style="height:'+h+'%;background:'+hueOf(a)+'"></i><b>'+q.left+q.op+q.right+'</b></div>';
    }
    jars+='</div><div class="plank"></div>';
    block.innerHTML=head+jars;
    host.appendChild(block);
    if(done&&!(pet&&pet.name)&&queue.indexOf(a)<0)queue.push(a);
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ren]'),function(el){
    el.onclick=function(){renaming=el.getAttribute('data-ren');showNamer();};
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-know]'),function(el){
    el.onclick=function(){knowTable(el.getAttribute('data-know'));};
  });
  $('shelfNote').textContent=countGlow()+' of '+totalJars()+' jars glowing · '+countPets()+' of '+SECS.length+' pets hatched · '+
    brewed+' potion'+(brewed===1?'':'s')+' brewed, all different.';
}
function showShelf(on){
  $('shelf').classList.toggle('on',on);
  $('play').classList.toggle('off',on);
  $('shelfBtn').textContent=on?'Back to brewing':'My shelf';
  if(on){cancelAnimationFrame(raf);locked=true;rack.classList.add('locked');buildShelf();}
  else ask();
}

/* ================= stories (the reward) ================= */
function hatchedNames(){var a=[],k;for(k in pets){if(pets[k]&&pets[k].name)a.push(pets[k].name);}return a;}
function fillStory(s){
  var names=hatchedNames();
  function one(ex){var pool=names.filter(function(n){return n!==ex;});return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;}
  var p1=one(null)||'your newest hatchling';
  var p2=one(p1)||'another little one';
  return s.replace(/\{pet2\}/g,p2).replace(/\{pet\}/g,p1);
}
function pickStoryIndex(){
  var free=[],i;
  for(i=0;i<STORIES.length;i++)if(!usedStories[i])free.push(i);
  if(!free.length){usedStories={};for(i=0;i<STORIES.length;i++)free.push(i);}
  return free[Math.floor(Math.random()*free.length)];
}
function showStory(){
  var i=pickStoryIndex();usedStories[i]=1;
  var text=fillStory(STORIES[i]);
  storyLog.push(text);save();
  var named=SECS.filter(function(k){return pets[k]&&pets[k].name;});
  var a=named.length?named[Math.floor(Math.random()*named.length)]:SECS[0];
  welcomeMode=false;bookReturn=false;
  $('storyTitle').textContent='A little lab tale';
  $('storyClose').textContent='Back to brewing';
  $('storyPet').innerHTML=petSVG(designFor(a),96,true,hueOf(a)).replace('<svg','<svg class="big"');
  $('storyText').textContent=text;
  $('done').classList.remove('on');
  $('story').classList.add('on');
  beep([523,659,784],0.2,0.07);
}
/* first-run welcome tale — seeds her storybook, then sends her to the shelf */
function startWelcome(){
  storyLog.push(WELCOME);save();
  welcomeMode=true;
  $('storyTitle').textContent='Welcome to the lab!';
  $('storyClose').textContent='See my lab →';
  var a=SECS[Math.floor(Math.random()*SECS.length)];
  $('storyPet').innerHTML=petSVG(designFor(a),96,true,hueOf(a)).replace('<svg','<svg class="big"');
  $('storyText').textContent=WELCOME;
  $('story').classList.add('on');
  beep([523,659,784,1046],0.24,0.09);
}
/* the whole collection: every tale numbered 1..N, owned ones readable, the rest locked */
function buildStorybook(){
  var host=$('bookGrid');host.innerHTML='';var got=0,i;
  for(i=0;i<STORIES.length;i++){
    var owned=!!usedStories[i];if(owned)got++;
    var el=document.createElement('button');
    el.className='bookcell'+(owned?' got':'');
    el.textContent=owned?(i+1):'?';
    if(owned){(function(idx){el.onclick=function(){readStory(idx);};})(i);}
    host.appendChild(el);
  }
  $('bookCount').textContent=got+' of '+STORIES.length+' tales collected';
}
/* re-read a collected tale; closing returns to the storybook */
function readStory(i){
  bookReturn=true;welcomeMode=false;
  var a=SECS.filter(function(k){return pets[k]&&pets[k].name;});
  a=a.length?a[Math.floor(Math.random()*a.length)]:SECS[0];
  $('storyTitle').textContent='Tale '+(i+1);
  $('storyClose').textContent='Back to my storybook';
  $('storyPet').innerHTML=petSVG(designFor(a),96,true,hueOf(a)).replace('<svg','<svg class="big"');
  $('storyText').textContent=fillStory(STORIES[i]);
  $('storybook').classList.remove('on');
  $('story').classList.add('on');
  beep([523,659,784],0.18,0.06);
}

/* ================= times-table helper (count up by the number) ================= */
var chartTimers=[];
function clearChartTimers(){chartTimers.forEach(clearTimeout);chartTimers=[];}
function buildGrid(){
  var g=$('grid');g.innerHTML='';var r,c,el;
  el=document.createElement('div');el.className='cell hdr';el.textContent='×';g.appendChild(el);
  for(c=1;c<=10;c++){el=document.createElement('div');el.className='cell hdr';el.textContent=c;g.appendChild(el);}
  for(r=1;r<=10;r++){
    el=document.createElement('div');el.className='cell hdr';el.textContent=r;g.appendChild(el);
    for(c=1;c<=10;c++){el=document.createElement('div');el.className='cell';el.id='c_'+r+'_'+c;el.textContent=r*c;g.appendChild(el);}
  }
}
function buildNumline(){
  var g=$('numline');g.innerHTML='';
  for(var v=0;v<=20;v++){var el=document.createElement('div');el.className='cell';el.id='nl_'+v;el.textContent=v;g.appendChild(el);}
}
function openChart(){
  if(!cur)return;
  clearChartTimers();
  if(SEC[cur.a].op==='x')openGrid();else openNumline();
  $('chart').classList.add('on');
}
/* multiplication: light the table's row up to the answer (count-by) */
function openGrid(){
  $('numline').style.display='none';$('grid').style.display='';
  var n=SEC[cur.a].n,b=cur.b,cells=$('grid').querySelectorAll('.cell'),i,c,r;
  $('chartHead').innerHTML='Counting up by <b>'+n+'</b>';
  $('chartSay').textContent='';
  for(i=0;i<cells.length;i++){cells[i].classList.remove('band','step','answer','dim');if(!cells[i].classList.contains('hdr'))cells[i].classList.add('dim');}
  for(c=1;c<=10;c++){var rc=$('c_'+n+'_'+c);if(rc){rc.classList.remove('dim');rc.classList.add('band');}}
  for(r=1;r<=10;r++){var cc=$('c_'+r+'_'+b);if(cc){cc.classList.remove('dim');cc.classList.add('band');}}
  var step=1;
  (function walk(){
    if(step>b)return;
    var cell=$('c_'+n+'_'+step);
    if(cell){cell.classList.remove('band');cell.classList.add(step<b?'step':'answer');}
    var seq=[],k;for(k=1;k<=step;k++)seq.push(n*k);
    $('chartSay').textContent=step<b?seq.join(' · '):(n+' × '+b+' = '+(n*b)+'  🎉');
    beep([440+step*45],0.09,0.035);step++;
    chartTimers.push(setTimeout(walk,620));
  })();
}
/* add/subtract: hop along the number line from start to answer */
function openNumline(){
  var q=factOf(cur.a,cur.b),start=q.left,up=(q.op==='+'),n=q.right,end=q.ans,delta=up?1:-1;
  $('grid').style.display='none';$('numline').style.display='';
  $('chartHead').innerHTML=(up?'Counting up by <b>':'Counting back by <b>')+n+'</b>';
  $('chartSay').textContent='';
  var cells=$('numline').querySelectorAll('.cell'),i,v;
  for(i=0;i<cells.length;i++){cells[i].classList.remove('band','step','answer');cells[i].classList.add('dim');}
  var lo=Math.min(start,end),hi=Math.max(start,end);
  for(v=lo;v<=hi;v++){var cc=$('nl_'+v);if(cc){cc.classList.remove('dim');cc.classList.add('band');}}
  var pos=start,seq=[start];
  (function walk(){
    var cell=$('nl_'+pos);
    if(cell){cell.classList.remove('band');cell.classList.add(pos===end?'answer':'step');}
    if(pos===end){$('chartSay').textContent=q.left+' '+q.op+' '+q.right+' = '+q.ans+'  🎉';beep([740],0.12,0.04);return;}
    $('chartSay').textContent=seq.join(up?' → ':' ← ');
    beep([440+seq.length*30],0.09,0.035);
    pos+=delta;seq.push(pos);
    chartTimers.push(setTimeout(walk,640));
  })();
}
function closeChart(){clearChartTimers();$('chart').classList.remove('on');}

/* ================= I already know this ================= */
function knowTable(a){
  if(!confirm('Light up all of '+SEC[a].label+'? Only tap this if you already know them!'))return;
  for(var b=1;b<=BMAX;b++){var f=getFact(a,b);f.n=Math.max(f.n,REPS);f.c=Math.max(f.c,REPS);f.s=Math.max(f.s,REPS);f.ema=f.ema||2500;f.e=1;}
  if(rowDone(a)&&!(pets[a]&&pets[a].name)&&queue.indexOf(a)<0)queue.push(a);
  save();updateMeta();buildShelf();
  if(queue.length)showNamer();
}

/* ================= practice mode (times tables ↔ add & subtract) ================= */
function refreshModeChips(){
  var x=$('modeX'),as=$('modeAS');
  if(x)x.classList.toggle('live',MODE==='x');
  if(as)as.classList.toggle('live',MODE==='as');
}
function switchMode(m){
  if(m===MODE)return;
  MODE=m;buildSecs();queue=[];drops=0;lastKey='';renaming=0;
  save();refreshModeChips();paintDrops();updateMeta();
  if($('shelf').classList.contains('on'))buildShelf();else ask();
}

/* ================= wiring ================= */
$('shelfBtn').onclick=function(){showShelf(!$('shelf').classList.contains('on'));};
$('brewBtn').onclick=function(){showShelf(false);};
$('modeX').onclick=function(){switchMode('x');};
$('modeAS').onclick=function(){switchMode('as');};
$('migrateYes').onclick=function(){doMigrate(pendingLegacy);};
$('migrateNo').onclick=function(){$('migrate').classList.remove('on');pendingLegacy=null;startWelcome();};
$('modeBtn').onclick=function(){
  calm=!calm;updateMode();save();
  if(!$('shelf').classList.contains('on')&&!$('done').classList.contains('on')&&!$('namer').classList.contains('on')){
    if(calm){cancelAnimationFrame(raf);}
    else if(!locked){tStart=Date.now();runFuse(cur?cur.limit:10000);}
  }
};
$('soundBtn').onclick=function(){
  sound=!sound;this.textContent=sound?'Sound on':'Sound off';
  this.setAttribute('aria-pressed',String(sound));save();
};
$('againBtn').onclick=function(){$('done').classList.remove('on');drops=0;paintDrops();updateMeta();ask();};
$('peekBtn').onclick=function(){$('done').classList.remove('on');drops=0;paintDrops();showShelf(true);};
$('nameBtn').onclick=takeName;
$('nameIn').addEventListener('keydown',function(e){if(e.key==='Enter')takeName();});
$('resetBtn').onclick=function(){
  if(!confirm('Empty every jar? The pets go back to being eggs too.'))return;
  facts={};plates={};pets={};used={};species={};usedStories={};storyLog=[];brewed=0;drops=0;streak=0;queue=[];
  ensureSpecies();preload();save();buildShelf();paintDrops();updateMeta();startWelcome();
};
$('exportBtn').onclick=exportSave;
$('importBtn').onclick=function(){$('importFile').click();};
$('importFile').onchange=function(){importSave(this.files[0]);this.value='';};
$('chartBtn').onclick=openChart;
$('chartClose').onclick=closeChart;
$('storyBtn').onclick=showStory;
$('storyClose').onclick=function(){
  $('story').classList.remove('on');
  if(bookReturn){bookReturn=false;buildStorybook();$('storybook').classList.add('on');return;}
  if(welcomeMode){welcomeMode=false;showShelf(true);return;}
  drops=0;paintDrops();updateMeta();ask();
};
$('storybookBtn').onclick=function(){buildStorybook();$('storybook').classList.add('on');};
$('bookClose').onclick=function(){$('storybook').classList.remove('on');};
function anyVeil(){return $('shelf').classList.contains('on')||$('done').classList.contains('on')||$('namer').classList.contains('on')||$('chart').classList.contains('on')||$('story').classList.contains('on')||$('storybook').classList.contains('on');}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeChart();$('storybook').classList.remove('on');return;}
  if(anyVeil())return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=4&&rack.children[n-1])rack.children[n-1].click();
});

/* ================= go ================= */
var hadSave=load();
buildSecs();                       /* fresh starts don't call absorb, so build here too */
ensureSpecies();
preload();
calm=true;                         /* always calm — no clock, no pressure */
$('modeBtn').style.display='none'; /* hide the timer toggle entirely */
$('soundBtn').textContent=sound?'Sound on':'Sound off';
$('soundBtn').setAttribute('aria-pressed',String(sound));
refreshModeChips();
updateMode();paintDrops();updateMeta();buildGrid();buildNumline();

if(hadSave){
  save();
  SECS.forEach(function(a){if(rowDone(a)&&!(pets[a]&&pets[a].name))queue.push(a);});
  var freshStart=(brewed===0&&storyLog.length===0&&countGlow()===0&&countPets()===0);
  if(queue.length)showNamer();
  else if(freshStart)startWelcome();
  else ask();
}else{
  var legacy=legacySave();
  if(legacy){ startMigration(legacy); }   /* wait for her choice — don't write the new save yet */
  else{ save(); startWelcome(); }
}

/* offline caching so it works with no wifi once added to the Home Screen */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
})();
</script>
